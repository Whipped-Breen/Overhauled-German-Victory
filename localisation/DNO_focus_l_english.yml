 GER_mittelafrika_construction:0 "Große Afrikanische Eisenbahn"
 GER_mittelafrika_construction_desc:0 "Mittelafrika's infrastructure is currently lacking, in order to fully exploit the continent we must establish a transcontinental railway, enabling us to efficiently transport resources, troops, equipment and Afrikanischearbeiters."
 GER_balkans:0 "Full Axis Control"
 GER_balkans_desc:0 "To insure total and absolute loyalty of all Axis states, we must crush all dissent within their governments and install total loyalty!"
 GER_german_control_of_italy:0 "Take Control of Italy"
 GER_german_control_of_italy_desc:0 "The Italian army has proven incaiperble of operating successfully without us. In order to secure our southern border we must take full control of the government in Rome."
 GER_iraq:0 "Take Iraq"
 GER_iraq_desc:0 "Iraq is suppling the Royal Navy with a rich stream of oil, keeping them active whilst our army struggles. We will support the four coup plotters, who call themselves the Golden Square, by giving them control of the Iraqi government we will cut off England's oil supply and redirect it to us."
 GER_persia_friend:0 "The Land of The Aryans"
 GER_persia_friend_desc:0 " Iranians are pure Aryans and will be excluded from the Nuremberg Laws. Iranian railways will be constructed by German engineers. We must embrace kinship between the National Socialist Reich and the Aryan culture of Iran."
 GER_persia_puppet:0 "Direct Control"
 GER_persia_puppet_desc:0 "To prevent Britain or the the Soviets form invading our allies in Iran, we must bring the Iranian state into our fold."
 GER_mittelafrika:0 "Mittelafrika"
 GER_mittelafrika_desc:0 "Thew region between our former colonies of East Africa, South West Africa and Kamerun will be annexed, a contiguous entity will be created covering the breadth of the African continent from the Atlantic to the Indian Ocean. Through the exploitation of natural resources, as well as contributing to our aim of self-sufficiency."
