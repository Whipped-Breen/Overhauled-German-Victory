 germany_plus.10.t:0 "SS-NKVD Cooperation"

 germany_plus.11.t:0 "SS-NKVD Cooperation"
 germany_plus.11.desc:0 "NKVD manpower has been sent to support the extra divisions from the USSR."
 germany_plus.11.a:0 "Useful"

 germany_plus.12.t:0 "Ultimatum to the Danish government"
 germany_plus.12.desc:0 "We have sent an ultimatum to the Danish government, including the following demands; A ban on people assembling in public, outlawing strikes, the introduction of a curfew, censorship should be conducted with German assistance, special (German military) courts should be introduced, and the death penalty should be introduced in cases of sabotage. In addition, the city of Odense was ordered to pay a fine of 1 million kroner for the death of a German soldier killed in that city and hostages were to be held as security.\n\nThe Danish government refused."
 germany_plus.12.a:0 "Institute martial law."

 germany_plus.13.t:0 "Occupation of Yugoslavia"
 germany_plus.13.desc:0 "Yugoslavia will be divided between the surrounding Axis states in accordance with territorial claims and control of key logistics and resources for the Reich."
 germany_plus.13.a:0 "Initiate Occupation! Make a [CRO.GetAdjective] puppet"
 germany_plus.13.b:0 "Initiate Occupation!"

 germany_plus.14.t:0 "[PER.GetAdjective] - [GER.GetAdjective] Treaty"
 germany_plus.14.desc:0 ""
 germany_plus.14.a:0 "They are our natural allies"
 germany_plus.14.b:0 "We are not their puppet"
 
 germany_plus.15.t:0 "[FROM.GetNameDef] has refused"
 germany_plus.15.desc:0 "[FROM.Capital.GetCapitalVictoryPointName] has refused our demands! They are hiding behind the Klaipeda Convention, claiming that Germany has no legal right to the Memel territory. We shall have to explain our position to them by different means..."
 germany_plus.15.a:0 "Well..."

 OGV_news.1.t:0 "Collapse of the Soviet Union"
 OGV_news.1.desc:0 "German officials have just announced the surrendering of European Russia too the Wehrmacht, with Siberia and Central Asia breaking off. However, in the east the Japanese and its puppets have seized countrol over the former USSR's territories in the East due to the Red Army having moved its forces to the nations's western front."
 OGV_news.1.a:0 "One less troublemaker in the world"
 OGV_news.1.b:0 "Finally"
 OGV_news.1.c:0 "One step closer to realising East Asian Co-Prosperity"
 OGV_news.1.d:0 "Time to carve out our own path"

 OGV_news.2.t:0 "Commonwealth Moves to Canada"
 OGV_news.2.desc:0 "With the fall of the British Isles [ENG.GetLeader] has relocated the Empire's government to Canada, in order to continue the war from overseas.\n\nYet it remains to be seen whether the shift in power will destabilize the Empire, and keep up the fight after such a loss."
 OGV_news.2.a:0 "The British are defiant."
 OGV_news.2.b:0 "We will never surrender!"
 
 OGV_news.3.t:0 "Armistice of London"
 OGV_news.3.desc:0 "An armistice between the German Reich and the United Kingdom has been signed at Westminster, in Royal Gallery below the large paintings of important moments in British military history.\n\nUnder the terms of the armistice, a British government under King Edward VIII will continue to administer the British mainland under [GER.GetNameAdjective] Supervision."
 OGV_news.3.a:0 "Disturbing."
 OGV_news.3.b:0 "England lives and marches on!"
 OGV_news.3.c:0 "We will never surrender!"