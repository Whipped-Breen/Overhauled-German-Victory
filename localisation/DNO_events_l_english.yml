 germany_plus.8.a:0 "If we work with the Germans, we may find the opportunity to reclaim other land."
 germany_plus.8.b:0 "We can count on British support, and they can count on us."
 germany_plus.8.c:0 "If these despots want to take our home, they have to fight for it."

 germany_plus.9.t:0 "Ultimatum from the [GER.GetFactionName]"
 germany_plus.9.desc:0 "With Turkey under the thumb of Germany, [From.GetLeader] has put pressure on our government to join their ranks. The Soviet-German alliance has put us in a position where neutrality is no longer an option, and now an ultimatum has arrived from Berlin demanding we cede our eastern territories to their Soviet allies and join them in the very pact they are using to force our hand.\n\nAlthough we cannot maintain neutrality, there are other options. Seeking support from Britain is one, standing our ground is another. None, however, can secure the future of the republic with certainty."
 germany_plus.9.a:0 "If we work with the Germans, we may find the opportunity to reclaim other land."
