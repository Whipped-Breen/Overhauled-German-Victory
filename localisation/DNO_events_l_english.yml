l_english:
 OGV_britain.1.t:0 "Fate of the Empire"
 OGV_britain.1.desc:0 "With the Wehrmacht marching though England's fields the time has come to decide the fate of our empire."
 OGV_britain.1.a:0 "Continue the war from Canada."
 OGV_britain.1.b:0 "Surrender the Mothercounty."
 OGV_britain.1.c:0 "Supersede the Empire."
 
 OGV_britain.2.t:0 "Triumph in Britain"
 OGV_britain.2.desc:0 "Our victory in Britain is complete. The British government has evacuated to Canada, leaving us in control of the mainland. We can now create a puppet regime under Edward VIII, not Mosley, as his dislike of war makes him unsuitable for such a position."
 OGV_britain.2.a:0 "Establish British puppet state."
 OGV_britain.2.b:0 "Rather not."
 
 OGV_britain.3.t:0 "Triumph in Ireland"
 OGV_britain.3.desc:0 "Our victory in Ireland is complete. The Irish  government has fled, leaving us in control of the mainland. We can now create a puppet regime under Irish politician Eoin O'Duffy."
 OGV_britain.3.a:0 "Establish Irish puppet state."
 OGV_britain.3.b:0 "Rather not."

 OGV_britain.4.t:0 "Division of Britain I"
 OGV_britain.4.desc:0 "In order to better controle the British Isles we can split off the second largest kingdom in the UK, so to dived there power."
 OGV_britain.4.a:0 "Establish Scotish puppet state."
 OGV_britain.4.b:0 "Rather not."

 OGV_britain.5.t:0 "Exile In Canada"
 OGV_britain.5.desc:0 ""
 OGV_britain.5.a:0 "Take full control of Canada"
 OGV_britain.5.b:0 "Move the goverment to Canada"
 OGV_britain.5.c:0 "Transfer the Commonwealth to Canada"

 OGV_britain.6.t:0 "Division of Britain II"
 OGV_britain.6.desc:0 "In order to better controle the British Isles we can split off the third largest kingdom in the UK, so to dived there power."
 OGV_britain.6.a:0 "Establish Welsh puppet state."
 OGV_britain.6.b:0 "Rather not."

 germany_plus.1.t:0 "Subservience to the Reich"

 germany_plus.2.t:0 "Subservience to the Reich"

 germany_plus.3.t:0 "Fate of Italy"
 germany_plus.3.desc:0 "We must now decide the fate of [ITA.GetLeader] and the Italian Peninsula"
 germany_plus.3.a:0 "Establish the Italian Social Republic and Reichsprotektorat Hochitalien!"
 germany_plus.3.b:0 "Establish the Italian Social Republic!"
 germany_plus.3.c:0 "Establish the Italian Social Republic, seize Germanic Italy!"

 germany_plus.4.t:0 "Occupation of Denmark"
 germany_plus.4.desc:0 "We will respect Danish sovereignty and territorial integrity, as well as neutrality, and most Danish institutions will continue to function relatively normally. King Christian X will remain in the country as Danish head of state. We will be formally represented by a Reichsbevollmächtigter."
 germany_plus.4.a:0 "Civilian occupation."

 germany_plus.5.t:0 "Transfer ownership of Åland"

 germany_plus.6.t:0 "Give Portuguese colonies to Mittelafrika"

 germany_plus.7.t:0 "Ultimatum from the [GER.GetFactionName]"
 germany_plus.7.desc:0 "With Turkey under the thumb of Germany, [From.GetLeader] has put pressure on our government to join their ranks. The Soviet-German alliance has put us in a position where neutrality is no longer an option, and now an ultimatum has arrived from Berlin demanding we cede our eastern territories to their Soviet allies and join them in the very pact they are using to force our hand.\n\nAlthough we cannot maintain neutrality, there are other options. Seeking support from Britain is one, standing our ground is another. None, however, can secure the future of the republic with certainty."
 germany_plus.7.a:0 "If we work with the Germans, we may find the opportunity to reclaim other land."
 germany_plus.7.b:0 "We can count on British support, and they can count on us."
 germany_plus.7.c:0 "If these despots want to take our home, they have to fight for it."

